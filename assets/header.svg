<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 150" width="100%" height="100%">
  <defs>
    <!-- Frosted Glass Gradient -->
    <linearGradient id="glass-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19394D" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#102638" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#071522" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Translucent Specular Border -->
    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#83DDF7" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#55C8F5" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#52788C" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#83DDF7" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Subtle Cyan Light Shimmer -->
    <radialGradient id="light-accent" cx="90%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#55C8F5" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#102638" stop-opacity="0"/>
    </radialGradient>

    <style>
      .f-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif;
      }
      .f-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Base Frosted Panel -->
  <rect x="2" y="2" width="956" height="146" rx="14" fill="url(#glass-card)" stroke="url(#glass-border)" stroke-width="1.2"/>
  <rect x="2" y="2" width="956" height="146" rx="14" fill="url(#light-accent)"/>

  <!-- Top Glass Highlight Line -->
  <path d="M 16 3 L 944 3" stroke="#83DDF7" stroke-width="1.5" stroke-opacity="0.45" stroke-linecap="round"/>

  <!-- Left Content -->
  <g transform="translate(42, 34)">
    <!-- Status Pill -->
    <g transform="translate(0, 0)">
      <rect width="250" height="22" rx="11" fill="#102638" stroke="#52788C" stroke-width="0.8"/>
      <circle cx="11" cy="11" r="3.5" fill="#55C8F5"/>
      <circle cx="11" cy="11" r="1.8" fill="#F2F7FA"/>
      <text x="22" y="15" class="f-mono" font-size="9.5" font-weight="600" fill="#83DDF7" letter-spacing="0.6px">
        ASPIRING AI &amp; ML ENGINEER
      </text>
    </g>

    <!-- Name -->
    <text x="0" y="52" class="f-sans" font-size="30" font-weight="700" fill="#F2F7FA" letter-spacing="-0.3px">
      Samruddhi Shetty
    </text>

    <!-- Education & Institution -->
    <text x="0" y="76" class="f-sans" font-size="14" font-weight="500" fill="#83DDF7">
      Third-Year B.Tech in Artificial Intelligence &amp; Machine Learning
    </text>
    <text x="0" y="96" class="f-sans" font-size="12.5" fill="#A8BBC9">
      Sahyadri College of Engineering and Management &#8226; Mangalore, Karnataka
    </text>
  </g>

  <!-- Right Technical Accent -->
  <g transform="translate(860, 75)">
    <!-- Outer Glass Ring -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#52788C" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="0" cy="0" r="28" fill="#19394D" stroke="#55C8F5" stroke-width="1.2" stroke-opacity="0.7"/>
    <circle cx="0" cy="0" r="14" fill="#102638" stroke="#83DDF7" stroke-width="1"/>
    <circle cx="0" cy="0" r="4" fill="#55C8F5"/>

    <!-- Orbital Nodes -->
    <circle cx="28" cy="0" r="2.5" fill="#83DDF7"/>
    <circle cx="-20" cy="-20" r="2" fill="#55C8F5"/>
    <circle cx="-14" cy="24" r="2" fill="#83DDF7"/>
  </g>
</svg>
