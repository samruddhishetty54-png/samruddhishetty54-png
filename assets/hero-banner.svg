<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080307"/>
      <stop offset="45%" stop-color="#14050e"/>
      <stop offset="80%" stop-color="#1c0714"/>
      <stop offset="100%" stop-color="#090308"/>
    </linearGradient>

    <!-- Burgundy Orb Gradients -->
    <radialGradient id="burgundy-glow-1" cx="30%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#7a1032" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#4a081e" stop-opacity="0.30"/>
      <stop offset="85%" stop-color="#18040b" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#080307" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="burgundy-glow-2" cx="80%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#9e1843" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#5a0924" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#080307" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="rose-highlight" cx="50%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Accent Gradients -->
    <linearGradient id="rose-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2557e" stop-opacity="0"/>
      <stop offset="25%" stop-color="#e2557e" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#fb7185" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e2557e" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="badge-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#670d27" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e2557e" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0815" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#14040b" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2557e" stroke-width="0.75" stroke-opacity="0.08"/>
      <circle cx="40" cy="40" r="1" fill="#f472b6" fill-opacity="0.18"/>
    </pattern>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.65; transform: scale(1); }
        50% { opacity: 0.95; transform: scale(1.06); }
      }
      @keyframes floatDrift {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-8px) translateX(6px); }
      }
      @keyframes scanline {
        0% { transform: translateY(0); opacity: 0.2; }
        50% { opacity: 0.6; }
        100% { transform: translateY(400px); opacity: 0.1; }
      }
      @keyframes beaconBlink {
        0%, 100% { opacity: 0.4; r: 3; }
        50% { opacity: 1; r: 5; }
      }
      @keyframes beamShine {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: -600; }
      }
      .glow-orb-1 {
        transform-origin: 350px 180px;
        animation: pulseGlow 8s ease-in-out infinite;
      }
      .glow-orb-2 {
        transform-origin: 950px 220px;
        animation: pulseGlow 10s ease-in-out infinite reverse;
      }
      .floating-constellation {
        animation: floatDrift 7s ease-in-out infinite;
      }
      .beacon-dot {
        animation: beaconBlink 2.2s ease-in-out infinite;
      }
      .animated-beam {
        stroke-dasharray: 120 480;
        animation: beamShine 6s linear infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, 'Helvetica Neue', sans-serif;
        font-weight: 800;
        letter-spacing: 2px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        font-weight: 500;
        letter-spacing: 0.5px;
      }
      .mono-text {
        font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, Monaco, monospace;
        letter-spacing: 1.2px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bg-grad)"/>

  <!-- Ambient Burgundy & Wine Radial Glows -->
  <ellipse class="glow-orb-1" cx="360" cy="180" rx="420" ry="240" fill="url(#burgundy-glow-1)"/>
  <ellipse class="glow-orb-2" cx="960" cy="220" rx="360" ry="200" fill="url(#burgundy-glow-2)"/>
  <circle cx="580" cy="140" r="180" fill="url(#rose-highlight)"/>

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Outer HUD Frame Border -->
  <rect x="18" y="18" width="1164" height="364" rx="16" fill="none" stroke="#670d27" stroke-width="1.2" stroke-opacity="0.45"/>
  <rect x="24" y="24" width="1152" height="352" rx="12" fill="none" stroke="#fb7185" stroke-width="0.75" stroke-opacity="0.18"/>

  <!-- Animated Top & Bottom Beams -->
  <line class="animated-beam" x1="100" y1="18" x2="1100" y2="18" stroke="url(#rose-line)" stroke-width="2.5"/>
  <line class="animated-beam" x1="1100" y1="382" x2="100" y2="382" stroke="url(#rose-line)" stroke-width="2.5"/>

  <!-- Futuristic Corner HUD Brackets -->
  <!-- Top Left -->
  <path d="M 18 48 L 18 18 L 48 18" fill="none" stroke="#fb7185" stroke-width="3" stroke-linecap="round"/>
  <circle cx="48" cy="48" r="2" fill="#fb7185" opacity="0.6"/>
  <!-- Top Right -->
  <path d="M 1152 18 L 1182 18 L 1182 48" fill="none" stroke="#fb7185" stroke-width="3" stroke-linecap="round"/>
  <circle cx="1152" cy="48" r="2" fill="#fb7185" opacity="0.6"/>
  <!-- Bottom Left -->
  <path d="M 18 352 L 18 382 L 48 382" fill="none" stroke="#fb7185" stroke-width="3" stroke-linecap="round"/>
  <circle cx="48" cy="352" r="2" fill="#fb7185" opacity="0.6"/>
  <!-- Bottom Right -->
  <path d="M 1152 382 L 1182 382 L 1182 352" fill="none" stroke="#fb7185" stroke-width="3" stroke-linecap="round"/>
  <circle cx="1152" cy="352" r="2" fill="#fb7185" opacity="0.6"/>

  <!-- Telemetry Top Bar -->
  <g transform="translate(56, 62)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="280" height="28" rx="14" fill="#200611" stroke="url(#badge-border)" stroke-width="1.2"/>
    <circle class="beacon-dot" cx="16" cy="14" r="4" fill="#fb7185" filter="url(#subtle-glow)"/>
    <circle cx="16" cy="14" r="2.2" fill="#ffffff"/>
    <text x="32" y="18" class="mono-text" font-size="11" font-weight="600" fill="#fdf2f4">AI &amp; ML SYSTEMS // ACTIVE</text>

    <!-- Coordinate Marks -->
    <text x="960" y="18" class="mono-text" font-size="11" fill="#a35874" text-anchor="end">SYS.LOC: SCEM.AIML // 2024-2028</text>
  </g>

  <!-- Geometric Circuit Network / Graphic on Right Side -->
  <g class="floating-constellation" transform="translate(860, 110)">
    <!-- Circuit Lines -->
    <path d="M 40 70 L 110 30 L 210 30 L 250 80 L 210 150 L 100 150 Z" fill="none" stroke="#9e1843" stroke-width="1.2" stroke-opacity="0.35"/>
    <path d="M 110 30 L 160 90 L 100 150" fill="none" stroke="#fb7185" stroke-width="1" stroke-opacity="0.25"/>
    <path d="M 160 90 L 250 80" fill="none" stroke="#e2557e" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="210" y1="30" x2="160" y2="90" stroke="#f472b6" stroke-width="1.2" stroke-opacity="0.35"/>

    <!-- Central Neural Node -->
    <circle cx="160" cy="90" r="26" fill="#3a091a" stroke="#fb7185" stroke-width="1.8" filter="url(#subtle-glow)"/>
    <circle cx="160" cy="90" r="14" fill="#6e0e29" stroke="#ffffff" stroke-width="0.8" opacity="0.9"/>
    <circle cx="160" cy="90" r="5" fill="#ffffff"/>

    <!-- Peripheral Nodes -->
    <circle cx="40" cy="70" r="5" fill="#f472b6" filter="url(#subtle-glow)"/>
    <circle cx="110" cy="30" r="6" fill="#fb7185"/>
    <circle cx="210" cy="30" r="5" fill="#e2557e"/>
    <circle cx="250" cy="80" r="6" fill="#f472b6"/>
    <circle cx="210" cy="150" r="5" fill="#e2557e"/>
    <circle cx="100" cy="150" r="6" fill="#fb7185"/>

    <!-- Code Labels -->
    <text x="160" y="132" class="mono-text" font-size="9" fill="#fbcfe8" text-anchor="middle" opacity="0.8">NEURAL_CORE</text>
    <text x="210" y="20" class="mono-text" font-size="8" fill="#fda4af" text-anchor="middle" opacity="0.7">XAI.PRED</text>
    <text x="260" y="98" class="mono-text" font-size="8" fill="#fda4af" opacity="0.7">OFFLINE.SYNC</text>
    <text x="25" y="65" class="mono-text" font-size="8" fill="#fda4af" text-anchor="end" opacity="0.7">ATS.JAVA</text>
  </g>

  <!-- Main Hero Typography & Content -->
  <g transform="translate(56, 130)">
    <!-- Pretitle / Kicker -->
    <text x="0" y="22" class="mono-text" font-size="12" font-weight="600" fill="#fb7185" filter="url(#subtle-glow)">
      &gt; IDENTITY_RECORDS // ASPIRING AI &amp; ML SPECIALIST
    </text>

    <!-- Main Name Title -->
    <text x="0" y="80" class="title-text" font-size="52" fill="#fff7f8" filter="url(#subtle-glow)">
      Samrudhi Shetty
    </text>

    <!-- Subtitle / Role -->
    <text x="2" y="118" class="subtitle-text" font-size="21" font-weight="600" fill="#f472b6">
      AI &amp; Machine Learning Engineer
    </text>

    <!-- Education & Affiliation -->
    <g transform="translate(2, 142)">
      <circle cx="5" cy="5" r="3" fill="#fb7185"/>
      <text x="18" y="9" class="subtitle-text" font-size="14.5" fill="#fce7f3">
        B.Tech in Artificial Intelligence &amp; Machine Learning
        <tspan fill="#d47395"> &#8226; </tspan>
        <tspan fill="#f5d0de">Sahyadri College of Engineering &amp; Management, Mangalore</tspan>
      </text>
    </g>

    <!-- Technical Tags / Pill Ribbons -->
    <g transform="translate(2, 182)">
      <!-- Tag 1: Python & Java -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="140" height="30" rx="8" fill="url(#card-grad)" stroke="#9e1843" stroke-width="1"/>
        <text x="70" y="19" class="mono-text" font-size="11" font-weight="600" fill="#fdf2f4" text-anchor="middle">PYTHON &#8226; JAVA</text>
      </g>

      <!-- Tag 2: Machine Learning -->
      <g transform="translate(152, 0)">
        <rect x="0" y="0" width="168" height="30" rx="8" fill="url(#card-grad)" stroke="#9e1843" stroke-width="1"/>
        <text x="84" y="19" class="mono-text" font-size="11" font-weight="600" fill="#fdf2f4" text-anchor="middle">MACHINE LEARNING</text>
      </g>

      <!-- Tag 3: Generative AI -->
      <g transform="translate(332, 0)">
        <rect x="0" y="0" width="162" height="30" rx="8" fill="url(#card-grad)" stroke="#9e1843" stroke-width="1"/>
        <text x="81" y="19" class="mono-text" font-size="11" font-weight="600" fill="#fdf2f4" text-anchor="middle">GENERATIVE AI (EXP)</text>
      </g>

      <!-- Tag 4: Offline-First Systems -->
      <g transform="translate(506, 0)">
        <rect x="0" y="0" width="176" height="30" rx="8" fill="url(#card-grad)" stroke="#9e1843" stroke-width="1"/>
        <text x="88" y="19" class="mono-text" font-size="11" font-weight="600" fill="#fdf2f4" text-anchor="middle">OFFLINE-FIRST ARCH</text>
      </g>

      <!-- Tag 5: SIH Hackathon -->
      <g transform="translate(694, 0)">
        <rect x="0" y="0" width="178" height="30" rx="8" fill="#360818" stroke="#fb7185" stroke-width="1.2"/>
        <circle cx="16" cy="15" r="3.5" fill="#fb7185"/>
        <text x="96" y="19" class="mono-text" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">SIH ROUND 2 FINALIST</text>
      </g>
    </g>
  </g>
</svg>
