<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%">
  <defs>
    <linearGradient id="prj-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090308"/>
      <stop offset="50%" stop-color="#14050f"/>
      <stop offset="100%" stop-color="#080206"/>
    </linearGradient>

    <linearGradient id="prj-card-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#220714" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10030a" stop-opacity="0.95"/>
    </linearGradient>

    <pattern id="dot-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#fb7185" fill-opacity="0.08"/>
    </pattern>

    <style>
      .p-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 16px;
        fill: #fff7f8;
      }
      .p-cat {
        font-family: 'SF Mono', Consolas, Menlo, monospace;
        font-size: 10px;
        font-weight: 600;
        fill: #fb7185;
        letter-spacing: 0.8px;
      }
      .p-desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12px;
        fill: #ecd5de;
        line-height: 1.45;
      }
      .p-tag {
        font-family: 'SF Mono', Consolas, Menlo, monospace;
        font-size: 9.5px;
        font-weight: 600;
        fill: #fda4af;
      }
      .p-link {
        font-family: 'SF Mono', Consolas, Menlo, monospace;
        font-size: 10.5px;
        font-weight: 700;
        fill: #f472b6;
      }
    </style>
  </defs>

  <rect width="1200" height="560" rx="16" fill="url(#prj-bg)"/>
  <rect width="1200" height="560" rx="16" fill="none" stroke="#4a081e" stroke-width="1.2"/>

  <!-- ==================== PROJECT 1: SEHASETU ==================== -->
  <g transform="translate(30, 24)">
    <rect width="555" height="245" rx="14" fill="url(#prj-card-1)"/>
    <rect width="555" height="245" rx="14" fill="url(#dot-grid)"/>
    <rect width="555" height="245" rx="14" fill="none" stroke="#670d27" stroke-width="1.2"/>

    <!-- Pill: Offline-First -->
    <rect x="22" y="20" width="136" height="22" rx="11" fill="#3b0918"/>
    <text x="90" y="34" class="p-cat" text-anchor="middle">OFFLINE-FIRST &#8226; HEALTH</text>

    <!-- Title -->
    <text x="22" y="66" class="p-title">SehaSetu &#8212; Rural Telemedicine Platform</text>
    
    <!-- Problem Statement -->
    <text x="22" y="92" class="p-desc">
      <tspan font-weight="600" fill="#ffffff">Problem:</tspan> Rural health clinics lack stable internet, preventing frontline
    </text>
    <text x="22" y="110" class="p-desc">
      health workers (ASHAs) from consulting doctors or storing diagnostic records.
    </text>
    <text x="22" y="128" class="p-desc">
      Features local-first IndexedDB storage and auto-sync on low-bandwidth networks.
    </text>

    <!-- Tech Stack Pills -->
    <g transform="translate(22, 146)">
      <rect x="0" y="0" width="62" height="22" rx="6" fill="#1d0612" stroke="#500a20" stroke-width="1"/>
      <text x="31" y="15" class="p-tag" text-anchor="middle">React</text>

      <rect x="70" y="0" width="72" height="22" rx="6" fill="#1d0612" stroke="#500a20" stroke-width="1"/>
      <text x="106" y="15" class="p-tag" text-anchor="middle">Node.js</text>

      <rect x="150" y="0" width="80" height="22" rx="6" fill="#1d0612" stroke="#500a20" stroke-width="1"/>
      <text x="190" y="15" class="p-tag" text-anchor="middle">IndexedDB</text>

      <rect x="238" y="0" width="82" height="22" rx="6" fill="#1d0612" stroke="#500a20" stroke-width="1"/>
      <text x="279" y="15" class="p-tag" text-anchor="middle">Auto-Sync</text>

      <rect x="328" y="0" width="94" height="22" rx="6" fill="#1d0612" stroke="#500a20" stroke-width="1"/>
      <text x="375" y="15" class="p-tag" text-anchor="middle">Tailwind CSS</text>
    </g>

    <!-- Repo Line -->
    <g transform="translate(22, 192)">
      <rect width="511" height="34" rx="8" fill="#16040e" stroke="#881337" stroke-width="1"/>
      <circle cx="20" cy="17" r="4" fill="#fb7185"/>
      <text x="32" y="21" class="p-link">REPO: github.com/charishma-rai/sehatsetu</text>
    </g>
  </g>

