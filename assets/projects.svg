    <!-- Problem Statement -->
    <text x="22" y="92" class="p-desc">
      <tspan font-weight="600" fill="#ffffff">Problem:</tspan> Job seekers lack quantitative ATS compatibility insights and
    </text>
    <text x="22" y="110" class="p-desc">
      instant skill-gap analysis when tailoring applications to specific job descriptions.
    </text>
    <text x="22" y="128" class="p-desc">
      Delivers automated parsing, ATS scoring algorithms, and structured database queries.
    </text>

    <!-- Tech Stack Pills -->
    <g transform="translate(22, 146)">
      <rect x="0" y="0" width="56" height="22" rx="6" fill="#1d0612" stroke="#500a20" stroke-width="1"/>
      <text x="28" y="15" class="p-tag" text-anchor="middle">Java</text>

      <rect x="64" y="0" width="62" height="22" rx="6" fill="#1d0612" stroke="#500a20" stroke-width="1"/>
      <text x="95" y="15" class="p-tag" text-anchor="middle">JDBC</text>

      <rect x="134" y="0" width="64" height="22" rx="6" fill="#1d0612" stroke="#500a20" stroke-width="1"/>
      <text x="166" y="15" class="p-tag" text-anchor="middle">MySQL</text>

      <rect x="206" y="0" width="64" height="22" rx="6" fill="#1d0612" stroke="#500a20" stroke-width="1"/>
      <text x="238" y="15" class="p-tag" text-anchor="middle">React</text>

      <rect x="278" y="0" width="88" height="22" rx="6" fill="#1d0612" stroke="#500a20" stroke-width="1"/>
      <text x="322" y="15" class="p-tag" text-anchor="middle">OpenAI API</text>
    </g>

    <!-- Repo Line -->
    <g transform="translate(22, 192)">
      <rect width="511" height="34" rx="8" fill="#16040e" stroke="#881337" stroke-width="1"/>
      <circle cx="20" cy="17" r="4" fill="#fb7185"/>
      <text x="32" y="21" class="p-link">REPO: samruddhishetty54-png/updated-resume-managment-system</text>
    </g>
  </g>

  <!-- ==================== PROJECT 3: ATTENDANCE TRACKER ==================== -->
  <g transform="translate(30, 290)">
    <rect width="555" height="245" rx="14" fill="url(#prj-card-1)"/>
    <rect width="555" height="245" rx="14" fill="url(#dot-grid)"/>
    <rect width="555" height="245" rx="14" fill="none" stroke="#670d27" stroke-width="1.2"/>

