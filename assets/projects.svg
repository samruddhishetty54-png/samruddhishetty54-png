    <!-- Problem Statement -->
    <text x="22" y="92" class="p-desc">
      <tspan font-weight="600" fill="#ffffff">Problem:</tspan> Manual attendance tracking causes arithmetic errors and delayed
    </text>
    <text x="22" y="110" class="p-desc">
      alerts when students fall below mandatory academic attendance thresholds (75%).
    </text>
    <text x="22" y="128" class="p-desc">
      Provides rigorous input validation, real-time calculation, and formatted reporting.
    </text>

    <!-- Tech Stack Pills -->
    <g transform="translate(22, 146)">
      <rect x="0" y="0" width="56" height="22" rx="6" fill="#1d0612" stroke="#500a20" stroke-width="1"/>
      <text x="28" y="15" class="p-tag" text-anchor="middle">Java</text>

      <rect x="64" y="0" width="94" height="22" rx="6" fill="#1d0612" stroke="#500a20" stroke-width="1"/>
      <text x="111" y="15" class="p-tag" text-anchor="middle">Swing / AWT</text>

      <rect x="166" y="0" width="60" height="22" rx="6" fill="#1d0612" stroke="#500a20" stroke-width="1"/>
      <text x="196" y="15" class="p-tag" text-anchor="middle">OOP</text>

      <rect x="234" y="0" width="124" height="22" rx="6" fill="#1d0612" stroke="#500a20" stroke-width="1"/>
      <text x="296" y="15" class="p-tag" text-anchor="middle">Event Handling</text>
    </g>

    <!-- Repo Line -->
    <g transform="translate(22, 192)">
      <rect width="511" height="34" rx="8" fill="#16040e" stroke="#881337" stroke-width="1"/>
      <circle cx="20" cy="17" r="4" fill="#fb7185"/>
      <text x="32" y="21" class="p-link">REPO: samruddhishetty54-png/attendance-tracker</text>
    </g>
  </g>

  <!-- ==================== PROJECT 4: FORGETRACK ==================== -->
  <g transform="translate(615, 290)">
    <rect width="555" height="245" rx="14" fill="url(#prj-card-1)"/>
    <rect width="555" height="245" rx="14" fill="url(#dot-grid)"/>
    <rect width="555" height="245" rx="14" fill="none" stroke="#670d27" stroke-width="1.2"/>

    <!-- Pill: Development -->
    <rect x="22" y="20" width="148" height="22" rx="11" fill="#3b0918"/>
    <text x="96" y="34" class="p-cat" text-anchor="middle">TASK &#8226; WORKFLOW TRACKER</text>

    <!-- Title -->
    <text x="22" y="66" class="p-title">ForgeTrack &#8212; Simulation &amp; Milestone Hub</text>
    
    <!-- Problem Statement -->
    <text x="22" y="92" class="p-desc">
      <tspan font-weight="600" fill="#ffffff">Problem:</tspan> Engineering students and trainees require structured tracking for
    </text>
    <text x="22" y="110" class="p-desc">
      virtual simulation tasks, software milestones, and technical competency progression.
    </text>
    <text x="22" y="128" class="p-desc">
      Architected to log modular developer workflows, code deliveries, and project sprints.
    </text>

    <!-- Tech Stack Pills -->
    <g transform="translate(22, 146)">
      <rect x="0" y="0" width="68" height="22" rx="6" fill="#1d0612" stroke="#500a20" stroke-width="1"/>
      <text x="34" y="15" class="p-tag" text-anchor="middle">Python</text>

      <rect x="76" y="0" width="92" height="22" rx="6" fill="#1d0612" stroke="#500a20" stroke-width="1"/>
      <text x="122" y="15" class="p-tag" text-anchor="middle">JavaScript</text>

      <rect x="176" y="0" width="88" height="22" rx="6" fill="#1d0612" stroke="#500a20" stroke-width="1"/>
      <text x="220" y="15" class="p-tag" text-anchor="middle">Web Stack</text>

      <rect x="272" y="0" width="134" height="22" rx="6" fill="#1d0612" stroke="#500a20" stroke-width="1"/>
      <text x="339" y="15" class="p-tag" text-anchor="middle">Milestone Engine</text>
    </g>

    <!-- Repo Line -->
    <g transform="translate(22, 192)">
      <rect width="511" height="34" rx="8" fill="#16040e" stroke="#881337" stroke-width="1"/>
      <circle cx="20" cy="17" r="4" fill="#fb7185"/>
      <text x="32" y="21" class="p-link">STATUS: Active Development &#8226; github.com/samruddhishetty54-png</text>
    </g>
