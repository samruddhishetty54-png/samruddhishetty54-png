<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="ach-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090307"/>
      <stop offset="50%" stop-color="#14050f"/>
      <stop offset="100%" stop-color="#080206"/>
    </linearGradient>

    <linearGradient id="primary-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b081a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#19040c" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="sec-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#220612" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#100309" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="gold-rose" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>

    <style>
      .ach-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 15px;
        fill: #fff7f8;
      }
      .ach-sub {
        font-family: 'SF Mono', Consolas, Menlo, monospace;
        font-size: 11px;
        fill: #f472b6;
        letter-spacing: 0.8px;
        font-weight: 600;
      }
      .ach-desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12.5px;
        fill: #ecd5de;
        line-height: 1.4;
      }
      .ach-tag {
        font-family: 'SF Mono', Consolas, Menlo, monospace;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 1px;
      }
    </style>
  </defs>

  <rect width="1200" height="240" rx="14" fill="url(#ach-bg)"/>
  <rect width="1200" height="240" rx="14" fill="none" stroke="#4a081e" stroke-width="1.2"/>

  <!-- SIH Highlight Card (Prominent - Left Half) -->
  <g transform="translate(24, 20)">
    <rect width="560" height="200" rx="12" fill="url(#primary-card)"/>
    <rect width="560" height="200" rx="12" fill="none" stroke="#fb7185" stroke-width="1.4" stroke-opacity="0.6"/>

    <!-- Trophy Icon Badge -->
    <circle cx="36" cy="38" r="16" fill="#580c26" stroke="#fb7185" stroke-width="1.2"/>
    <text x="36" y="44" font-family="'Segoe UI Emoji', sans-serif" font-size="16" text-anchor="middle">🏆</text>

    <!-- Header & Badge -->
    <text x="64" y="34" class="ach-title">Smart India Hackathon (SIH)</text>
    <text x="64" y="50" class="ach-sub">NATIONAL LEVEL HACKATHON &#8226; 2024</text>

    <rect x="410" y="24" width="132" height="24" rx="12" fill="#881337"/>
    <text x="476" y="40" class="ach-tag" fill="#ffffff" text-anchor="middle">ROUND 2 QUALIFIED</text>

    <!-- Details -->
    <text x="24" y="90" class="ach-desc">
      <tspan font-weight="600" fill="#ffffff">Team selected for the second round of Smart India Hackathon (SIH)</tspan>
    </text>
    <text x="24" y="114" class="ach-desc">
      Competing nationwide with <tspan fill="#f472b6" font-weight="600">"Bhasha Setu"</tspan> &#8212; an innovative multilingual
    </text>
    <text x="24" y="136" class="ach-desc">
      communication bridge and linguistic inclusivity platform.
    </text>

    <!-- Footer pill -->
    <rect x="24" y="156" width="220" height="24" rx="6" fill="#1b0610" stroke="#670d27" stroke-width="0.8"/>
    <text x="34" y="172" class="ach-tag" fill="#fda4af">VERIFIED COMPETITIVE RECORD</text>
  </g>

  <!-- Other Achievements (Grid on Right Half) -->
  <!-- Socio Spark Hackathon -->
  <g transform="translate(610, 20)">
    <rect width="566" height="92" rx="10" fill="url(#sec-card)"/>
    <rect width="566" height="92" rx="10" fill="none" stroke="#670d27" stroke-width="1"/>

    <circle cx="28" cy="32" r="14" fill="#310a19"/>
    <text x="28" y="37" font-family="'Segoe UI Emoji', sans-serif" font-size="14" text-anchor="middle">🌲</text>

    <text x="54" y="30" class="ach-title" font-size="14">Socio Spark Hackathon &#8226; IoT Innovation</text>
    <text x="54" y="47" class="ach-sub" font-size="10">HARDWARE PROTOTYPING &#8226; 24-HOUR SPRINT</text>
    <text x="54" y="72" class="ach-desc" font-size="11.5">
      Engineered IoT Sandalwood Tree Protection System for illegal logging detection.
    </text>
  </g>

  <!-- Mathematics Excellence -->
  <g transform="translate(610, 128)">
    <rect width="566" height="92" rx="10" fill="url(#sec-card)"/>
    <rect width="566" height="92" rx="10" fill="none" stroke="#670d27" stroke-width="1"/>

    <circle cx="28" cy="32" r="14" fill="#310a19"/>
    <text x="28" y="37" font-family="'Segoe UI Emoji', sans-serif" font-size="14" text-anchor="middle">📐</text>

    <text x="54" y="30" class="ach-title" font-size="14">National Math Society Excellence Certificate</text>
    <text x="54" y="47" class="ach-sub" font-size="10">ANALYTICAL &amp; QUANTITATIVE RECOGNITION</text>
    <text x="54" y="72" class="ach-desc" font-size="11.5">
      Honored with the Mathematics Excellence Certificate for quantitative problem-solving.
    </text>
  </g>
</svg>
