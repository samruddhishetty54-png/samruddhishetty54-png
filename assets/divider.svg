<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="100%" height="24">
  <defs>
    <linearGradient id="divider-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0"/>
      <stop offset="20%" stop-color="#9e1843" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#e2557e" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#e2557e" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#9e1843" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#9e1843" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#9e1843" stop-opacity="0"/>
    </radialGradient>

    <filter id="div-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes pulseDiamond {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.2); opacity: 1; }
      }
      .center-diamond {
        transform-origin: 600px 12px;
        animation: pulseDiamond 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Ambient Central Glow -->
  <circle cx="600" cy="12" r="12" fill="url(#center-glow)"/>

  <!-- Horizontal Divider Line -->
  <line x1="60" y1="12" x2="1140" y2="12" stroke="url(#divider-grad)" stroke-width="1.2"/>

  <!-- Central Diamond Accent -->
  <g class="center-diamond">
    <polygon points="600,6 606,12 600,18 594,12" fill="#fff5f7" stroke="#fb7185" stroke-width="1.2" filter="url(#div-glow)"/>
    <circle cx="600" cy="12" r="1.5" fill="#e2557e"/>
  </g>
</svg>
