<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="100%" height="100%">
  <defs>
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080206"/>
      <stop offset="50%" stop-color="#14050f"/>
      <stop offset="100%" stop-color="#080206"/>
    </linearGradient>

    <radialGradient id="ft-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#881337" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#4c0519" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#080206" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ft-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0"/>
      <stop offset="25%" stop-color="#9e1843" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#fb7185" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#9e1843" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </linearGradient>

    <filter id="ft-blur">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes pulseDot {
        0%, 100% { opacity: 0.5; r: 3; }
        50% { opacity: 1; r: 5; }
      }
      .ft-pulse {
        animation: pulseDot 2.4s ease-in-out infinite;
      }
      .ft-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 2.5px;
        fill: #fff5f7;
      }
      .ft-sub {
        font-family: 'SF Mono', Consolas, Menlo, monospace;
        font-size: 11px;
        letter-spacing: 1.2px;
        fill: #d4a5b8;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="130" fill="url(#footer-bg)"/>
  <ellipse cx="600" cy="65" rx="450" ry="60" fill="url(#ft-glow)"/>

  <!-- Top Accent Line -->
  <line x1="80" y1="12" x2="1120" y2="12" stroke="url(#ft-line)" stroke-width="1.5"/>

  <!-- Top Center Accent Pip -->
  <circle class="ft-pulse" cx="600" cy="12" r="4" fill="#fb7185" filter="url(#ft-blur)"/>
  <circle cx="600" cy="12" r="2" fill="#ffffff"/>

  <!-- Center Text -->
  <g transform="translate(600, 56)">
    <text class="ft-title" text-anchor="middle">
      SAMRUDHI SHETTY &#8226; CONTINUOUS LEARNING &amp; TECHNICAL EXCELLENCE
    </text>
    <text y="28" class="ft-sub" text-anchor="middle">
      B.Tech AI &amp; ML &#8226; Sahyadri College of Eng. &amp; Management &#8226; Mangaluru, India
    </text>
    <text y="50" class="ft-sub" text-anchor="middle" fill="#9e1843" font-size="9.5">
      &gt; EOF // CRAFTED WITH ARCHITECTURAL PRECISION
    </text>
  </g>

  <!-- Left / Right Geometric HUD Accents -->
  <path d="M 40 100 L 40 115 L 65 115" fill="none" stroke="#670d27" stroke-width="1.2"/>
  <path d="M 1160 100 L 1160 115 L 1135 115" fill="none" stroke="#670d27" stroke-width="1.2"/>
</svg>
